on:
  push:
    branches:
      - main
  pull_request:

env:
  nixpkgs_version: 9fbb54b33e91ee4ca368e35a78e0613c720600b3 # renovate: datasource=git-refs depName=NixOS/nixpkgs packageName=https://github.com/NixOS/nixpkgs currentValue=nixos-unstable

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -euo pipefail {0}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/${{ env.nixpkgs_version }}.tar.gz
          extra_nix_config: |
            extra-experimental-features = auto-allocate-uids cgroups nix-command
            auto-allocate-uids = true

      - run: nix config show

      - run: nix-build module-test.nix
