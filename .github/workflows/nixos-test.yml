on:
  push:
    branches:
      - main
  pull_request:

env:
  nixpkgs_version: 9fbb54b33e91ee4ca368e35a78e0613c720600b3 # renovate: datasource=git-refs depName=NixOS/nixpkgs packageName=https://github.com/NixOS/nixpkgs currentValue=nixos-unstable

jobs:
  test:
    # nb. ${{ true && '' || 'cachix' }} gives 'cachix'
    environment: ${{ github.ref == 'refs/heads/main' && 'default-branch' || '' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -euo pipefail {0}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
        with:
          nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/${{ env.nixpkgs_version }}.tar.gz
          extra_nix_config: |
            extra-experimental-features = auto-allocate-uids cgroups nix-command
            auto-allocate-uids = true

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: bmillwood
          signingKey: ${{ secrets.CACHIX_SIGNING_KEY }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - run: nix config show

      - run: nix-build module-test.nix
